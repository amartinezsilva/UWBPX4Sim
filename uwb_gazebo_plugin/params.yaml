# UWBGazeboSystem plugin parameters.
#
# setup_simulator.sh reads this file and writes its values into the
# <plugin name="custom::UWBGazeboSystem"> block in PX4's
# src/modules/simulation/gz_bridge/server.config on every run, so this file
# is the single source of truth for the plugin's tuning -- edit here, then
# re-run setup_simulator.sh to apply. Do not rename these keys; each one maps
# directly to an SDF parameter read by UWBGazeboSystem.cpp. See README.md
# ("Plugin parameters") for what each one does. Values shown match the
# plugin's own compiled-in defaults, except hard_nlos_gap_ratio (see below).
#
# This exact baseline is also saved as presets/eliko_identification.yaml --
# reload it from there (via the setup GUI's preset dropdown, or by copying
# it back over this file) if you've since switched to a different preset
# (e.g. presets/util_identification.yaml) and want to come back to it.

# Base GZ topics for simulated / ground-truth ranges.
topic: /uwb_gz_simulator/distances
ground_truth_topic: /uwb_gz_simulator/distances_ground_truth

# Additive Gaussian noise mean.
gaussian_noise_mean_cm: 0.0

# Persistent per-pair bias.
apply_pair_bias: false
bias_min_cm: -27.0
bias_max_cm: 20.0

# NLOS-aware degradation.
enable_nlos_dropout: true
nlos_endpoint_margin_m: 0.02

# LOS distance-based dropout curve.
los_dropout_start_distance_m: 10.0
los_dropout_end_distance_m: 70.0
los_hard_dropout_distance_m: 75.0

# Blocked-thickness thresholds.
los_max_thickness_m: 0.10
soft_nlos_max_thickness_m: 0.50
blackout_thickness_m: 1.0
# Compiled-in default is 0.50; kept at 0.75 here to match the currently
# tuned/running setup (this was the value in README.md's example block).
hard_nlos_gap_ratio: 0.75

# Dropout probability bounds.
min_dropout_probability: 0.02
max_dropout_probability: 0.90

# Noise standard-deviation curve.
min_noise_stddev_cm: 12.0
max_noise_stddev_cm: 50.0
los_stddev_start_distance_m: 15.0
los_stddev_end_distance_m: 75.0

# Extra weight given to blocked thickness vs. distance.
nlos_dropout_thickness_extra_weight: 0.50
nlos_stddev_thickness_extra_weight: 0.50

# Ranging mode: "twr" (default, one range per anchor-tag pair, matching
# real Eliko TWR hardware and this plugin's original behaviour) or "tdoa"
# (one differential measurement per anchor-pair-relative-to-tag, matching
# TDOA infrastructure like Bitcraze's LPS/UTIL dataset). A global switch,
# not per-pair -- real deployments use one or the other for the whole
# anchor infrastructure. In tdoa mode, the lowest-numbered anchor is the
# reference anchor; noise/dropout reuse the same distance/thickness curves
# above (TDOA noise = sum of the two legs' variances, dropout = either leg
# failing), so no separate calibration is needed to switch modes. Published
# on tdoa_topic/tdoa_ground_truth_topic below instead of topic/
# ground_truth_topic, since a TDOA value isn't a distance.
uwb_mode: twr
tdoa_topic: /uwb_gz_simulator/tdoa
tdoa_ground_truth_topic: /uwb_gz_simulator/tdoa_ground_truth

# Material-aware NLOS attenuation (opt-in; off by default so existing
# worlds keep their exact current behaviour). When enabled, an obstacle's
# link or model name carrying a "__material_<name>" suffix (e.g.
# "wall_1__material_metal") has its raycast-intersection length scaled by
# that material's multiplier below *before* it enters the thickness-severity
# curve above -- a thin metal obstacle can equal a thick wood one. Obstacles
# without a recognized suffix use material_attenuation_default. Multipliers
# are relative to this plugin's original undifferentiated thickness (1.0 =
# full severity, matching pre-material-attenuation behaviour).
#
# The per-material defaults below reflect the *qualitative* ordering seen in
# the UTIL dataset's NLOS material tests (cardboard/foam/wood close to LOS;
# metal severe) -- see presets/util_identification.yaml's NLOS note -- not
# precisely back-solved coefficients, since UTIL doesn't report the real
# obstacles' physical thickness.
enable_material_attenuation: false
material_attenuation_default: 1.0
material_attenuation_metal: 1.0
material_attenuation_wood: 0.08
material_attenuation_cardboard: 0.03
material_attenuation_plastic: 0.15
material_attenuation_foam: 0.02
