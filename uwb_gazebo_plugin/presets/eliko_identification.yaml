# UWBGazeboSystem plugin parameters -- "eliko_identification" preset.
#
# Calibrated from the author's own identification dataset collected with a
# real Eliko UWB system (TWR hardware) -- analogous in spirit to how
# presets/util_identification.yaml is calibrated from the published UTIL
# dataset (DWM1000/Bitcraze LPS, TDOA), just a different, privately-run
# identification campaign on different hardware. hard_nlos_gap_ratio is
# kept at 0.75 (compiled-in default is 0.50) to match that tuning, as
# documented in README.md's example block. uwb_mode: twr to match the real
# Eliko hardware's own ranging scheme (eliko_messages/DistancesList) -- see
# the "Ranging mode" section of README.md.
#
# Load via the setup GUI's "Plugin Parameters" tab (Preset dropdown), or
# ./setup_simulator.sh --params eliko_identification (or pick it from the
# terminal picker when --params is omitted).

# Base GZ topics for simulated / ground-truth ranges.
topic: /uwb_gz_simulator/distances
ground_truth_topic: /uwb_gz_simulator/distances_ground_truth

# Additive Gaussian noise mean.
gaussian_noise_mean_cm: 0.0

# Persistent per-pair bias.
apply_pair_bias: false
bias_min_cm: -27.0
bias_max_cm: 20.0

# NLOS-aware degradation.
enable_nlos_dropout: true
nlos_endpoint_margin_m: 0.02

# LOS distance-based dropout curve.
los_dropout_start_distance_m: 10.0
los_dropout_end_distance_m: 70.0
los_hard_dropout_distance_m: 75.0

# Blocked-thickness thresholds.
los_max_thickness_m: 0.10
soft_nlos_max_thickness_m: 0.50
blackout_thickness_m: 1.0
# Compiled-in default is 0.50; kept at 0.75 here to match the currently
# tuned/running setup (this was the value in README.md's example block).
hard_nlos_gap_ratio: 0.75

# Dropout probability bounds.
min_dropout_probability: 0.02
max_dropout_probability: 0.90

# Noise standard-deviation curve.
min_noise_stddev_cm: 12.0
max_noise_stddev_cm: 50.0
los_stddev_start_distance_m: 15.0
los_stddev_end_distance_m: 75.0

# Extra weight given to blocked thickness vs. distance.
nlos_dropout_thickness_extra_weight: 0.50
nlos_stddev_thickness_extra_weight: 0.50

# Ranging mode: TWR, matching real Eliko hardware (eliko_messages/
# DistancesList) and this plugin's original behaviour.
uwb_mode: twr
tdoa_topic: /uwb_gz_simulator/tdoa
tdoa_ground_truth_topic: /uwb_gz_simulator/tdoa_ground_truth

# Material-aware NLOS model: off, matching this preset's baseline
# (undifferentiated-obstacle) behaviour -- every obstacle uses the generic
# thickness curve above. When turned on, the per-material penetration
# lengths/permittivities default to the plugin's compiled-in table (see
# README.md, "Measurement model"); override any of them here as
# material_<name>_penetration_m / material_<name>_permittivity.
enable_material_attenuation: false
material_los_max_severity: 0.05
nlos_dropout_material_extra_weight: 1.0
nlos_stddev_material_extra_weight: 1.0
material_metal_detour_bias_cm: 35.0
