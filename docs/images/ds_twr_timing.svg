<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330">
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="aq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker></defs>
<rect width="760" height="330" fill="#ffffff"/>
<line x1="110" y1="90" x2="720" y2="90" stroke="#888" stroke-width="2"/>
<line x1="110" y1="190" x2="720" y2="190" stroke="#888" stroke-width="2"/>
<text x="100" y="95" text-anchor="end" fill="#222" font-size="14" font-family="Helvetica, Arial, sans-serif">Tag</text>
<text x="100" y="195" text-anchor="end" fill="#222" font-size="14" font-family="Helvetica, Arial, sans-serif">Anchor</text>
<!-- tag-side intervals -->
<path d="M150,49 L150,44 L400,44 L400,49" fill="none" stroke="#666" stroke-width="1.2"/>
<text x="275" y="36" text-anchor="middle" fill="#666" font-size="13" font-family="Helvetica, Arial, sans-serif">round 1: R<tspan baseline-shift="sub" font-size="10">a</tspan> = t<tspan baseline-shift="sub" font-size="10">4</tspan> − t<tspan baseline-shift="sub" font-size="10">1</tspan></text>
<path d="M400,49 L400,44 L530,44 L530,49" fill="none" stroke="#666" stroke-width="1.2"/>
<text x="465" y="36" text-anchor="middle" fill="#666" font-size="13" font-family="Helvetica, Arial, sans-serif">reply: D<tspan baseline-shift="sub" font-size="10">a</tspan> = t<tspan baseline-shift="sub" font-size="10">5</tspan> − t<tspan baseline-shift="sub" font-size="10">4</tspan></text>
<!-- messages -->
<line x1="150" y1="90" x2="208" y2="188" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#ab)"/>
<circle cx="150" cy="90" r="3.5" fill="#2a78d6"/>
<text x="172" y="146" text-anchor="end" fill="#2a78d6" font-size="13" font-family="Helvetica, Arial, sans-serif">poll</text>
<line x1="340" y1="190" x2="398" y2="92" stroke="#eb6834" stroke-width="2.2" marker-end="url(#ao)"/>
<circle cx="340" cy="190" r="3.5" fill="#eb6834"/>
<text x="378" y="146" text-anchor="start" fill="#eb6834" font-size="13" font-family="Helvetica, Arial, sans-serif">response</text>
<line x1="530" y1="90" x2="588" y2="188" stroke="#1baf7a" stroke-width="2.2" marker-end="url(#aq)"/>
<circle cx="530" cy="90" r="3.5" fill="#1baf7a"/>
<text x="566" y="146" text-anchor="start" fill="#1baf7a" font-size="13" font-family="Helvetica, Arial, sans-serif">final</text>
<!-- timestamps -->
<text x="150" y="78" text-anchor="middle" fill="#222" font-size="14" font-family="Helvetica, Arial, sans-serif">t<tspan baseline-shift="sub" font-size="10">1</tspan></text>
<text x="400" y="78" text-anchor="middle" fill="#222" font-size="14" font-family="Helvetica, Arial, sans-serif">t<tspan baseline-shift="sub" font-size="10">4</tspan></text>
<text x="530" y="78" text-anchor="middle" fill="#222" font-size="14" font-family="Helvetica, Arial, sans-serif">t<tspan baseline-shift="sub" font-size="10">5</tspan></text>
<text x="210" y="210" text-anchor="middle" fill="#222" font-size="14" font-family="Helvetica, Arial, sans-serif">t<tspan baseline-shift="sub" font-size="10">2</tspan></text>
<text x="340" y="210" text-anchor="middle" fill="#222" font-size="14" font-family="Helvetica, Arial, sans-serif">t<tspan baseline-shift="sub" font-size="10">3</tspan></text>
<text x="590" y="210" text-anchor="middle" fill="#222" font-size="14" font-family="Helvetica, Arial, sans-serif">t<tspan baseline-shift="sub" font-size="10">6</tspan></text>
<!-- anchor-side intervals -->
<path d="M210,221 L210,226 L340,226 L340,221" fill="none" stroke="#666" stroke-width="1.2"/>
<text x="275" y="245" text-anchor="middle" fill="#666" font-size="13" font-family="Helvetica, Arial, sans-serif">reply: D<tspan baseline-shift="sub" font-size="10">b</tspan> = t<tspan baseline-shift="sub" font-size="10">3</tspan> − t<tspan baseline-shift="sub" font-size="10">2</tspan></text>
<path d="M340,221 L340,226 L590,226 L590,221" fill="none" stroke="#666" stroke-width="1.2"/>
<text x="465" y="245" text-anchor="middle" fill="#666" font-size="13" font-family="Helvetica, Arial, sans-serif">round 2: R<tspan baseline-shift="sub" font-size="10">b</tspan> = t<tspan baseline-shift="sub" font-size="10">6</tspan> − t<tspan baseline-shift="sub" font-size="10">3</tspan></text>
<line x1="110" y1="262" x2="720" y2="262" stroke="#666" stroke-width="1" marker-end="url(#ag)"/><text x="725" y="267" text-anchor="start" fill="#666" font-size="12" font-family="Helvetica, Arial, sans-serif">time</text>
<text x="380" y="305" text-anchor="middle" fill="#222" font-size="15" font-family="Helvetica, Arial, sans-serif">time of flight = (R<tspan baseline-shift="sub" font-size="10">a</tspan> R<tspan baseline-shift="sub" font-size="10">b</tspan> − D<tspan baseline-shift="sub" font-size="10">a</tspan> D<tspan baseline-shift="sub" font-size="10">b</tspan>) / (R<tspan baseline-shift="sub" font-size="10">a</tspan> + R<tspan baseline-shift="sub" font-size="10">b</tspan> + D<tspan baseline-shift="sub" font-size="10">a</tspan> + D<tspan baseline-shift="sub" font-size="10">b</tspan>)</text>
</svg>
