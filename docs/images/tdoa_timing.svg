<text x="380.0" y="345" text-anchor="middle" fill="#222" font-size="15" font-family="Helvetica, Arial, sans-serif" >d<tspan baseline-shift="sub" font-size="10">j</tspan> − d<tspan baseline-shift="sub" font-size="10">i</tspan> = c × ((r<tspan baseline-shift="sub" font-size="10">j</tspan> − r<tspan baseline-shift="sub" font-size="10">i</tspan>) − (T<tspan baseline-shift="sub" font-size="10">j</tspan> − T<tspan baseline-shift="sub" font-size="10">i</tspan>))</text>
